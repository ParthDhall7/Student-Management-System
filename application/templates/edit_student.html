{% extends "base.html" %}
{% block content %}
<h2>Edit Student</h2>
<form method="post" action="{{ url_for('edit_student', student_id=student['id']) }}" class="card" novalidate>
    <label>Student Name</label>
    <input type="text" name="name" value="{{ student.get('name', '') }}">
    <label>Roll Number</label>
    <input type="text" name="roll_number" value="{{ student.get('roll_number', '') }}">
    <label>Email</label>
    <input type="text" name="email" value="{{ student.get('email', '') }}">
    <label>Department</label>
    <input type="text" name="department" value="{{ student.get('department', '') }}">
    <label>Age</label>
    <input type="text" name="age" value="{{ student.get('age', '') }}">
    <button type="submit" class="btn btn-primary">Save Changes</button>
    <a href="{{ url_for('index') }}" class="btn btn-grey">Cancel</a>
</form>
{% endblock %}
